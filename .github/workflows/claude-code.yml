name: Claude Code → PR

# Claude Code runs headless on OpenRouter, does what the request below says, and leaves a pull request with
# the result. Manual only (workflow_dispatch): it spends money and writes to the repository, so it happens
# when you ask for it, never on a push.
#
# The request is the "task" input. The agent works on a branch of its own (claude/ci-<something>) off the
# main line, so its work is a pull request like any other.
#
# Every step of the conversation goes to the Actions log, so you can watch it work: the agent's own words as
# it goes, and the tools it calls.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What the agent should do
        type: string
        required: false
      model:
        description: The model to run (an OpenRouter model id; the [1m] suffix asks for the 1M-token window)
        type: string
        required: false
        default: 'minimax/minimax-m3.1-flash:free[1m]'
      base:
        description: The branch the agent's branch starts from
        type: string
        required: false
        default: 'claude/gallant-keller-3qzp97'
      branch:
        description: The branch the agent works on (its pull request's head)
        type: string
        required: false
      title:
        description: The pull request's title (the agent writes one if this is empty)
        type: string
        required: false
      max-turns:
        description: How many turns the agent may take
        type: string
        required: false
        default: '40'
      playtest:
        description: Build the game and let the agent play it (a browser, through Playwright)
        type: boolean
        required: false
        default: false

# The agent commits and pushes its branch and opens the pull request, so it needs to write.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: claude-code-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  agent:
    name: Run Claude Code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the agent's branch starts from a base that may be any branch

      # Claude Code's own installer, pinned to the version this workflow was written against. The native install
      # puts the binary in ~/.local/bin, which is not on PATH in a non-interactive step.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.308
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Read the request
        id: request
        env:
          TASK_INPUT: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [ -z "$TASK_INPUT" ]; then
            echo "::error::No task: fill in the task input."
            exit 1
          fi
          echo "task<<TASK_EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TASK_INPUT" >> "$GITHUB_OUTPUT"
          echo "TASK_EOF" >> "$GITHUB_OUTPUT"
          # Also in a file, so the task reaches the agent without the shell ever seeing its text (a quote
          # in the task would otherwise break the command that runs it).
          printf '%s\n' "$TASK_INPUT" > "$RUNNER_TEMP/task.txt"

      # The agent's own files (its instructions, the browser's settings) live in the repository, but the
      # agent's branch is cut from the base, where they may not be. So they are copied aside first, and
      # the run uses the copies.
      - name: Keep the agent's own files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent"
          install -m 644 .github/claude-code/system-prompt.md "$RUNNER_TEMP/agent/system-prompt.md"
          install -m 644 .github/claude-code/mcp.json "$RUNNER_TEMP/agent/mcp.json"
          install -m 644 .github/claude-code/playwright-mcp.json "$RUNNER_TEMP/agent/playwright-mcp.json"
          ls -l "$RUNNER_TEMP/agent"

      # The branch the agent works on: the one that was asked for, or one made from the task's words.
      - name: Make the agent's branch
        id: branch
        env:
          BASE: ${{ inputs.base }}
          ASKED: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          # The base branch first: the agent's branch starts from it.
          git fetch origin "$BASE" --quiet
          base_sha=$(git rev-parse "origin/$BASE")
          branch=$ASKED
          if [ -z "$branch" ]; then
            # A name from the task's first words, the way the rest of the repository names its branches
            # (claude/<what-it-is>), so the branch says what the work is.
            slug=$(tr '[:upper:]' '[:lower:]' < "$RUNNER_TEMP/task.txt" | tr -cs 'a-z0-9' '\n' |
              grep -vE '^(the|a|an|to|of|and|for|in|on|please|add|make|fix|update|write)$' | head -4 | tr '\n' '-' | sed 's/-$//')
            [ -n "$slug" ] || slug=task
            branch="claude/ci-$slug"
          fi
          # A branch name that is already taken would fail the push; make it unique instead.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="$branch-$(date +%s)"
          fi
          git switch -c "$branch" "$base_sha"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      # The agent's work: the code change the task asks for. The run's log is the agent's window: every
      # message and every tool call is printed as it happens.
      - name: Run Claude Code
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: '' # must be set and empty, or Claude Code authenticates against Anthropic itself
          ANTHROPIC_MODEL: ${{ inputs.model }}
          DISABLE_UPDATES: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          PLAYWRIGHT_MCP_CONFIG: ${{ runner.temp }}/agent/playwright-mcp.json
        run: |
          set -o pipefail
          # The task on stdin, from the file, so its text never passes through the shell: a quote or a
          # backtick in the task would otherwise change the command that runs it.
          claude -p \
            --model '${{ inputs.model }}' \
            --output-format stream-json --verbose \
            --permission-mode acceptEdits \
            --permission-prompts none \
            --allowedTools Read Edit Write Glob Grep Bash \
              mcp__playwright__browser_navigate \
              mcp__playwright__browser_click \
              mcp__playwright__browser_press_key \
              mcp__playwright__browser_evaluate \
              mcp__playwright__browser_take_screenshot \
              mcp__playwright__browser_console_messages \
              mcp__playwright__browser_snapshot \
              mcp__playwright__browser_resize \
              mcp__playwright__browser_wait_for \
              mcp__playwright__browser_find \
              mcp__playwright__browser_run_code_unsafe \
            --max-turns '${{ inputs.max-turns }}' \
            --append-system-prompt-file "$RUNNER_TEMP/agent/system-prompt.md" \
            < "$RUNNER_TEMP/task.txt" \
          | tee "$RUNNER_TEMP/stream.jsonl" \
          | python3 -I tools/claude_log.py

      # The playtest: a real build of the game as the agent left it, served on a port, so the agent can
      # play its own change instead of only reading it. It comes after the agent's work on purpose: a
      # build of the code before the change would show nothing new.
      - name: Get the project ready for Unity
        if: inputs.playtest
        id: project
        uses: ./.github/actions/unity-project
        with:
          vendor-token: ${{ secrets.VENDOR_PAT }}
          strict: 'false'

      - name: Build WebGL for the playtest
        if: inputs.playtest
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: ${{ steps.project.outputs.image }}
          targetPlatform: WebGL
          buildMethod: PooketSlug.EditorTools.WebGLBuild.Build
          customParameters: -buildSha ${{ github.sha }} -photonAppId ${{ secrets.PHOTON_APP_ID }}
          versioning: None

      - name: Serve the build
        if: inputs.playtest
        run: |
          set -euo pipefail
          python3 -m http.server 8001 --bind 127.0.0.1 --directory build/WebGL/WebGL > "$RUNNER_TEMP/site.log" 2>&1 &
          for i in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8001/index.html && break
            sleep 1
          done
          echo "The game is at http://127.0.0.1:8001/index.html"

      # A browser for the agent: Node and Playwright's Chromium, the same ones the game's own browser tests
      # use. The MCP server finds the Chromium here.
      - name: Set up Playwright
        if: inputs.playtest
        uses: ./.github/actions/playwright

      # The second half of the agent's turn: the game is up, so it plays its own change and says what it
      # saw. It is a second session with the same instructions and the game in front of it.
      - name: Play the change
        if: inputs.playtest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_MODEL: ${{ inputs.model }}
          DISABLE_UPDATES: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          PLAYWRIGHT_MCP_CONFIG: ${{ runner.temp }}/agent/playwright-mcp.json
        run: |
          set -o pipefail
          printf '%s\n' 'The game is built and served at http://127.0.0.1:8001/index.html. Play it in the browser, look at the change you just made, and report what you saw: what works, what looks wrong, and what you could not reach. Take a screenshot of what you played. Do not change any files.' \
            | claude -p \
              --model '${{ inputs.model }}' \
              --output-format stream-json --verbose \
              --permission-mode acceptEdits \
              --permission-prompts none \
              --allowedTools Read Edit Write Glob Grep Bash \
                mcp__playwright__browser_navigate \
                mcp__playwright__browser_click \
                mcp__playwright__browser_press_key \
                mcp__playwright__browser_evaluate \
                mcp__playwright__browser_take_screenshot \
                mcp__playwright__browser_console_messages \
                mcp__playwright__browser_snapshot \
                mcp__playwright__browser_resize \
                mcp__playwright__browser_wait_for \
                mcp__playwright__browser_find \
                mcp__playwright__browser_run_code_unsafe \
              --max-turns '${{ inputs.max-turns }}' \
              --append-system-prompt-file "$RUNNER_TEMP/agent/system-prompt.md" \
              --mcp-config "$RUNNER_TEMP/agent/mcp.json" \
            | tee "$RUNNER_TEMP/playtest.jsonl" \
            | python3 -I tools/claude_log.py
          # The agent's own words about what it played, for the pull request's body.
          python3 -I tools/claude_log.py --result "$RUNNER_TEMP/playtest.jsonl" > "$RUNNER_TEMP/playtest-report.md" || true

      # The playtest's screenshots, so they can be read after the run.
      - name: Upload the playtest's screenshots
        if: always() && inputs.playtest
        uses: actions/upload-artifact@v6
        with:
          name: playtest
          path: playtest
          if-no-files-found: ignore
          retention-days: 7

      # The agent is asked to commit and push its own work, but a run that stopped short is still worth
      # having: whatever it left in the working tree is committed here and pushed. It runs even when the
      # agent's run failed, so a run that ran out of turns still leaves its work behind.
      - name: Commit and push anything the agent left
        if: always()
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Nothing to commit: the agent committed everything itself."
            exit 0
          fi
          git config user.name 'Claude Code'
          git config user.email 'noreply@anthropic.com'
          git add -A
          git commit -m "what the agent did not commit itself

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          # A plain push first; the branch is the agent's own, so forcing it is fine when the plain
          # push is refused (the agent pushed, and this commit is on top of what it pushed).
          git push origin "HEAD:$BRANCH" || git push --force origin "HEAD:$BRANCH"

      - name: Open the pull request
        if: always() # a run that failed still has work worth reviewing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE: ${{ steps.branch.outputs.base }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          # Nothing to ask about if the agent left no commits: no pull request, and the log says why.
          if [ "$(git rev-list --count "origin/$BASE..HEAD")" -eq 0 ]; then
            echo "The agent left no commits, so there is nothing to review."
            exit 0
          fi
          # The agent was asked to push its own branch; if it committed but did not push, push it here.
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Pushing the branch: the agent left it unpushed."
            git push --force-with-lease origin "HEAD:$BRANCH"
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "The pull request is already open."
            exit 0
          fi
          # The title the agent wrote in its last commit, or the one that was asked for, or the task's first line.
          title=$TITLE
          if [ -z "$title" ]; then
            title=$(git log -1 --pretty=%s | head -1)
          fi
          if [ -z "$title" ] || [ "$title" = "what the agent did not commit itself" ]; then
            title=$(head -1 "$RUNNER_TEMP/task.txt" | cut -c1-72)
          fi
          {
            echo "Claude Code did this work, on request, through OpenRouter."
            echo
            echo "### The request"
            echo
            sed 's/^/> /' "$RUNNER_TEMP/task.txt"
            echo
            echo "### What it did"
            echo
            git log --pretty='- %s' "origin/$BASE..HEAD" 2>/dev/null || true
            # What the agent said when it played its own change, if the run had a playtest.
            if [ -f "$RUNNER_TEMP/playtest-report.md" ]; then
              echo
              echo "### What it saw when it played it"
              echo
              cat "$RUNNER_TEMP/playtest-report.md"
            fi
          } > "$RUNNER_TEMP/body.md"
          gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body-file "$RUNNER_TEMP/body.md"
