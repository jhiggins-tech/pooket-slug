name: WebGL build → GitHub Pages

# One site on the gh-pages branch, many builds (the pipeline agreed in the workflow review, 16 Oct):
# - the main line, claude/gallant-keller-3qzp97, runs every check and deploys the game to the root only once the
#   co-op tests have passed (the live game never gets a build they failed);
# - every other branch deploys a preview to previews/<branch without claude/>/ (its item's Try it link) straight after
#   the build. The co-op tests run only when the branch changes the netcode, the kit demos only when it changes the
#   crew (what counts: the plan job), or when a commit message asks with a line "CI: co-op" or "CI: demos". Spike
#   branches (claude/spike-<name>) skip both;
# - a branch whose commit the main line already has builds nothing (a mirror of the main line, or a merged branch);
# - a deleted or merged branch's preview goes at the next deploy (tools/pages_deploy.sh); a deleted one's goes at once
#   by the delete trigger, since this file is on the default branch (GitHub runs delete triggers from there only).
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore: # docs never change the game, and a redeploy changes the build version co-op players must share
      - '**.md'
      - 'docs/**'
      - 'sandbox/**' # the sandbox's setups go live on their own (sandbox-files.yml), with no build
      - 'scenes/**' # and so do the cutscenes (scene-files.yml)
  delete:
  workflow_dispatch:

permissions:
  contents: write # the deploy pushes the build to the gh-pages branch

env:
  MAIN_LINE: claude/gallant-keller-3qzp97

# Each branch has its own queue, so branches build side by side. Within a branch, a run under way finishes (and
# deploys) before the next starts; of the pushes that land meanwhile, only the newest waits its turn. Cancelling the
# run under way instead (as it did until 2026-10-16) meant that with several threads pushing to the same branch,
# nothing ever got as far as deploying.
concurrency:
  group: webgl-pages-${{ github.event_name == 'delete' && 'prune' || github.ref_name }}
  cancel-in-progress: false

jobs:
  # What this push builds and where it goes.
  plan:
    name: Plan the build
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      light: ${{ steps.plan.outputs.light }}
      slug: ${{ steps.plan.outputs.slug }}
      coop: ${{ steps.plan.outputs.coop }}
      demos: ${{ steps.plan.outputs.demos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: tools

      - name: Main line, preview or spike
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          slug=$(tools/slug.sh "$GITHUB_REF_NAME")
          light=false; build=true; coop=true; demos=true
          if [ "$GITHUB_REF_NAME" = "$MAIN_LINE" ]; then
            slug=; echo "### Main line: deploys to the live game" >> "$GITHUB_STEP_SUMMARY"
          else
            case $slug in spike-*) light=true ;; esac
            compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$MAIN_LINE...$GITHUB_SHA" || echo '{}')
            status=$(jq -r '.status // "unknown"' <<<"$compare")
            # What the branch changes from the main line. If the list can't be had (or is cut off at 300 files),
            # everything runs.
            files=$(jq -r 'if (.files | length) < 300 then .files[].filename else "?" end' <<<"$compare" 2>/dev/null || echo '?')
            changes() { grep -qE "^(\?|.github/workflows/webgl-pages.yml|$1)" <<<"$files"; }
            changes 'Assets/Scripts/Net/|Assets/Scripts/World/NetSync.cs|Assets/Scripts/Core/Platform/NetContracts.cs|tools/coop.mjs' ||
              grep -qix 'CI: co-op' <<<"$MESSAGE" || coop=false
            changes 'Assets/Scripts/Crew/|Assets/Scripts/Core/Crew/KitGuide.cs|Assets/Plugins/WebGL/PooketDemo.jslib|tools/demos.mjs' ||
              grep -qix 'CI: demos' <<<"$MESSAGE" || demos=false
            if [ $light = true ]; then coop=false; demos=false; fi
            if [ "$status" = identical ] || [ "$status" = behind ]; then
              build=false
              echo "### Nothing to preview: the main line already has \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### Preview: previews/$slug/ (co-op tests: $([ $coop = true ] && echo yes || echo no), kit demos: $([ $demos = true ] && echo yes || echo no))" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          { echo "build=$build"; echo "light=$light"; echo "slug=$slug"; echo "coop=$coop"; echo "demos=$demos"; } >> "$GITHUB_OUTPUT"

  # The cutscenes pass the scene check (tools/scenecheck, as scene-files.yml runs it) before the build, which carries
  # them and the narrator's recordings to the site as scenes/ (the game fetches them at start-up, Game.FetchScenes).
  scenes:
    name: Check the scenes
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools
            scenes
            Assets/Scripts/Core

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check the scenes
        env:
          GH_TOKEN: ${{ secrets.VENDOR_PAT }}
        run: tools/check_scenes.sh site-scenes

      - name: Upload the scenes for the site
        uses: actions/upload-artifact@v6
        with:
          name: site-scenes
          path: site-scenes
          if-no-files-found: error
          retention-days: 7 # GitHub's default is 90; a run's files are only read for a few days

  build-and-deploy:
    name: Build WebGL with GameCI and deploy
    needs: [plan, scenes]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The unityci/editor WebGL image is ~7 GB compressed. Rather than spend 2 minutes deleting preinstalled tools to
      # make room for it, Docker keeps its images on the runner's second disk (/mnt), which is mostly empty
      # (spike-ci-disk: 8 s instead of 126).
      - name: Move Docker's storage to the second disk
        run: |
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'Docker storage: {{.DockerRootDir}}'
          df -h / /mnt

      - name: Checkout
        uses: actions/checkout@v5

      # Photon's license forbids redistributing the SDK, so it is stored as a release asset in a private
      # repo and unpacked into Assets/Photon here, before Unity starts (see tools/unpack_unitypackage.py).
      - name: Fetch Photon Fusion SDK
        env:
          GH_TOKEN: ${{ secrets.VENDOR_PAT }}
          FUSION_TAG: fusion-2.1.3
          FUSION_FILE: Photon-Fusion-2.1.3-Stable-2390.unitypackage
          FUSION_SHA256: 375e21bc771ce5f7cea942b5f804e7c28c8f4d858f7e9aab96725214564bc52e
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret VENDOR_PAT is not set (read-only token for jhiggins-tech/pooket-slug-vendor)."
            exit 1
          fi
          gh release download "$FUSION_TAG" -R jhiggins-tech/pooket-slug-vendor -p "$FUSION_FILE" -D vendor
          echo "$FUSION_SHA256  vendor/$FUSION_FILE" | sha256sum -c -
          python3 -I tools/unpack_unitypackage.py "vendor/$FUSION_FILE" .
          # our committed Fusion config wins over anything the package ships
          git checkout -- Assets/Photon/Fusion/Resources/NetworkProjectConfig.fusion

      # Sounds the vendor repository's CI makes and publishes as zips of WAVs; without any of them the game still
      # builds, a little quieter:
      # - the arcade announcer's lines (text-to-speech, voice/lines.json there): announcer.zip;
      # - the cutscene narrator's lines (voice F from the narrator voice spike, voice/narration.json there):
      #   narration.zip, <line>.wav for each line;
      # - the boss music's final section played by an orchestra (the chip crossfades to it), rendered from the
      #   game's own notes (music/ there): orchestra.zip;
      # - the title theme (Lyria take D as a seamless loop, title.wav): start-music.zip, which also holds the other
      #   takes, so only title.bytes is kept.
      - name: Fetch the announcer, narrator, orchestra and title theme
        env:
          GH_TOKEN: ${{ secrets.VENDOR_PAT }}
        run: |
          tools/vendor_fetch.sh --bytes announcer Assets/Resources/Voice "the announcer stays quiet in this build"
          tools/vendor_fetch.sh --bytes narration Assets/Resources/Narration "the narrator is subtitles only"
          tools/vendor_fetch.sh --bytes orchestra Assets/Resources/Music "the boss music stays chip"
          tools/vendor_fetch.sh --bytes start-music "$RUNNER_TEMP/start-music" "the splash screen is silent"
          if [ -f "$RUNNER_TEMP/start-music/title.bytes" ]; then cp "$RUNNER_TEMP/start-music/title.bytes" Assets/Resources/Music/; fi

      # The cutscenes built into the game (scenes/*.txt as Resources/Scenes), the copy that plays when the site's can't
      # be reached or has a problem.
      - name: Build in the scenes
        run: |
          mkdir -p Assets/Resources/Scenes
          cp scenes/*.txt Assets/Resources/Scenes/
          ls -l Assets/Resources/Scenes

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      # The tests run in the same editor image as the build, so it's only pulled once.
      - name: Pick the editor image
        id: editor
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          echo "image=unityci/editor:ubuntu-$version-webgl-3" >> "$GITHUB_OUTPUT"

      # EditMode tests for the pure game logic (Assets/Scripts/Core, tests in Assets/Tests/EditMode), then
      # PlayMode tests for the gameplay (Assets/Tests/Gameplay: a real World, ticked frame by frame). A
      # failing test stops the job here, so a broken build never deploys. Pinned to v4.3.2, the last
      # release that runs Unity itself: v4.4.0 (the v4 tag) wraps game-ci/cli, which rejected the flag the
      # action passed for coverageEnabled: false. No githubToken, so no check run: the summary lists results.
      # One Unity (and one container) per test mode: run together, PlayMode can leave Unity's IL post-processing
      # runner alive, and EditMode then dies with "Cannot access a closed pipe", reported as compiler errors.
      - name: Run the EditMode tests (GameCI)
        id: editmode
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: ${{ steps.editor.outputs.image }}
          testMode: editmode
          artifactsPath: test-results/editmode

      - name: Run the PlayMode tests (GameCI)
        id: playmode
        # after a red EditMode run too, so one run shows both modes' results
        if: success() || steps.editmode.outcome == 'failure'
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: ${{ steps.editor.outputs.image }}
          testMode: playmode
          artifactsPath: test-results/playmode

      - name: Test summary
        if: always() && steps.editmode.outcome != 'skipped'
        run: |
          # to the log as well as the summary, so a failure can be read from the job's log alone
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob('test-results/**/*.xml', recursive=True))
          if not files:
              print("### Tests\n\nNo results: Unity stopped before writing them. The test steps' logs say why.")
              raise SystemExit
          for missing in sorted({'EditMode', 'PlayMode'} - {'PlayMode' if 'playmode' in f.lower() else 'EditMode' for f in files}):
              print(f"### {missing} tests: no results\n\nUnity stopped before writing them. Their step's log says why.\n")
          for path in files:
              run = ET.parse(path).getroot()
              mode = 'PlayMode' if 'playmode' in path.lower() else 'EditMode'
              print(f"### {mode} tests: " + ("passed" if run.get("result", "").startswith("Passed") else "failed"))
              print()
              line = (f"{run.get('passed')} of {run.get('total')} passed, {run.get('failed')} failed, "
                      f"{run.get('skipped')} skipped, in {float(run.get('duration') or 0):.1f} s.")
              print(line)
              # Also an annotation on the run, which the checks API can read without the log or the artifact.
              print(f"::notice title={mode} tests::{line}", file=sys.stderr)
              failed = [t for t in run.iter('test-case') if t.get('result') == 'Failed']
              if failed:
                  print()
              for t in failed[:30]:
                  message = (t.findtext('failure/message') or '').strip().splitlines()
                  print(f"- `{t.get('fullname')}`: {message[0] if message else 'failed'}")
              print()
          EOF

      - name: Upload test results
        if: always() && steps.editmode.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: tests
          path: test-results
          if-no-files-found: ignore
          retention-days: 7 # GitHub's default is 90; a run's files are only read for a few days

      - name: Build WebGL (GameCI)
        uses: game-ci/unity-builder@v4.8.2 # pinned, as the test runner is: the floating v4 tag could change under us
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: PooketSlug.EditorTools.WebGLBuild.Build
          customParameters: -buildSha ${{ github.sha }} -photonAppId ${{ secrets.PHOTON_APP_ID }} -googleClientId ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }} -firebaseApiKey ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }} -firebaseDbUrl ${{ vars.FIREBASE_DB_URL || secrets.FIREBASE_DB_URL }}
          versioning: None

      # Two thumbs on an emulated phone held sideways (tools/touch.mjs: the stick and FIRE, then pause), against the
      # build just made: a page error or a START that doesn't get the mission going stops it before it deploys.
      - name: Set up Node for the touch test
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Play it by touch
        id: touch
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8001 --bind 127.0.0.1 --directory build/WebGL/WebGL > touch-server.log 2>&1 &
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8001/index.html && break; sleep 1; done
          node tools/touch.mjs http://127.0.0.1:8001/index.html touch-test

      - name: Upload the touch test
        if: always() && steps.touch.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: touch-test
          path: touch-test
          if-no-files-found: ignore

      # The ⓘ kit screen's demo clips: the build just made plays each move's scripted scene (?demo=all, KitGuide.cs) in
      # headless Chromium, which records it, and tools/demos.mjs cuts it into a clip for each move in demos/, so the
      # clips always match the build they ship with. If recording fails, the build still deploys, and the kit screen
      # says there's no demo yet.
      - name: Set up Node
        if: needs.plan.outputs.demos == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Record the kit screen's demos
        id: demos
        if: needs.plan.outputs.demos == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 --bind 127.0.0.1 --directory build/WebGL/WebGL > demo-server.log 2>&1 &
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/index.html && break; sleep 1; done
          node tools/demos.mjs http://127.0.0.1:8000/index.html demos
          sudo mkdir -p build/WebGL/WebGL/demos
          sudo cp demos/*.mp4 build/WebGL/WebGL/demos/
          ls -l build/WebGL/WebGL/demos

      - name: Demos summary
        if: always() && steps.demos.outcome != 'skipped'
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          try:
              demos = json.load(open('demos/demos.json'))
          except Exception:
              print("### Kit demos: not recorded\n\nThe recording step's log says why; the kit screen says there's no demo yet.")
              raise SystemExit
          print(f"### Kit demos: {len(demos)} recorded\n")
          print("| Move | Game seconds | Recorded in | Size |")
          print("|---|---|---|---|")
          for d in demos:
              print(f"| `{d['id']}` | {d['gameSeconds']} s | {d['recordedSeconds']} s | {d['bytes'] // 1024} KB |")
          EOF

      - name: Upload the demos
        if: always() && steps.demos.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: kit-demos
          path: demos
          if-no-files-found: ignore
          retention-days: 7 # GitHub's default is 90; a run's files are only read for a few days

      # The sandbox's setups (sandbox-files.yml puts them up between builds), so a deploy keeps them.
      - name: Add the sandbox's setups
        run: |
          if ls sandbox/*.txt >/dev/null 2>&1; then
            sudo mkdir -p build/WebGL/WebGL/sandbox
            sudo cp sandbox/*.txt build/WebGL/WebGL/sandbox/
          fi

      # The scenes and the narrator's recordings, checked (the scenes job), so a deploy keeps them.
      - name: Fetch the checked scenes
        uses: actions/download-artifact@v8
        with:
          name: site-scenes
          path: site-scenes

      - name: Add the scenes
        run: |
          sudo mkdir -p build/WebGL/WebGL/scenes
          sudo cp -R site-scenes/. build/WebGL/WebGL/scenes/
          ls -lR build/WebGL/WebGL/scenes | head -40

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: PooketSlug-WebGL
          path: build/WebGL/WebGL
          if-no-files-found: error
          retention-days: 7 # GitHub's default is 90; a run's files are only read for a few days

      # A preview goes into previews/<slug>/ now, leaving the rest of the site be. The main line's build waits for the
      # co-op tests (the deploy-live job).
      - name: Deploy the preview to gh-pages
        if: needs.plan.outputs.slug != ''
        env:
          SLUG: ${{ needs.plan.outputs.slug }}
        run: tools/pages_deploy.sh preview "$SLUG" build/WebGL/WebGL

      - name: Summary
        env:
          SLUG: ${{ needs.plan.outputs.slug }}
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          {
            echo "### Pooket Slug WebGL build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo "- Unity: \`$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)\`"
            echo "- Build size: $(du -sh build/WebGL/WebGL | cut -f1)"
            if [ -z "$SLUG" ]; then echo "- Goes live at $site once the co-op tests pass"; else echo "- Preview: ${site}previews/$SLUG/ (all previews: ${site}previews/)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A deleted branch's preview goes now rather than at the next deploy. GitHub runs delete triggers only from the
  # default branch's copy of this file.
  prune-previews:
    name: Remove deleted branches' previews
    if: github.event_name == 'delete' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: tools

      - name: Prune
        run: tools/pages_deploy.sh prune

  # Two players in two headless browsers, against the build just made: A and B join the co-op room (one of its own per round, ?room=),
  # both play, then A leaves and B must take over the shared world, and the other scenarios below. GitHub's runners
  # can open the WebSockets Photon needs (the cloud sandbox can't), so this is where co-op gets tested. Three run at
  # once: at most 7 players per branch, so two branches testing together stay under Photon's free 20.
  coop-test:
    name: Co-op test (${{ matrix.mode }})
    needs: [plan, build-and-deploy]
    if: needs.plan.outputs.coop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - mode: code # join, invite, play, and hand over the world
          - mode: boss # fight the boss together (a stand-in, as Mission one is solo only)
          - mode: scene # watch a scene together (a stand-in, as Mission one is solo only)
          - mode: dropin # drop in to a mission under way (spike drop-in, doesn't fail the build)
            optional: true
          - mode: handover # hand the world over when the host's phone goes to the background
          - mode: watch # a third phone watches a full room (three phones)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: PooketSlug-WebGL
          path: site

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Serve the build
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory site > server.log 2>&1 &
          for i in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/index.html && exit 0
            sleep 1
          done
          echo "::error::The build didn't start serving on port 8000."
          exit 1

      - name: Play the scenario
        continue-on-error: ${{ matrix.optional == true }}
        run: node tools/coop.mjs http://127.0.0.1:8000/index.html coop-test ${{ matrix.mode }}

      - name: Summary
        if: always()
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, os
          runs = {
              "code": ("Two-player co-op test", [
                  ("hostOnline", "A joins the co-op room"),
                  ("guestOnline", "B joins the same room"),
                  ("joined", "A sees B join"),
                  ("invite", "A's den copies an invite link to the room (the TV, or H)"),
                  ("played", "Both play with no errors or disconnects"),
                  ("pickup", "A's world hands out the test crate (?test=crate)"),
                  ("takeover", "B takes over the world when A leaves"),
              ]),
              "boss": ("Two-player boss fight", [
                  ("hostOnline", "A joins the co-op room"),
                  ("guestOnline", "B joins the same room"),
                  ("joined", "A sees B join"),
                  ("played", "Both fight the boss with no errors or disconnects"),
                  ("bossIntro", "Both screens get the boss intro"),
                  ("bossFought", "A's tank rolls out and fires"),
                  ("bossFollowed", "B's boss tank follows the turret of A's"),
                  ("bossFired", "B sees the boss tank fire in A's world"),
              ]),
              "scene": ("Two-player scene (?test=scene)", [
                  ("hostOnline", "A joins the co-op room"),
                  ("guestOnline", "B joins the same room"),
                  ("joined", "A sees B join"),
                  ("bothInScene", "Starting together, a scene plays on both phones"),
                  ("waited", "A tapping alone moves neither phone on"),
                  ("tappedThrough", "Both tapping moves each shot on"),
                  ("together", "It ends on both phones together"),
                  ("played", "Both play on with no errors or disconnects"),
              ]),
              "dropin": ("Drop-in (spike, ?spike=dropin)", [
                  ("hostOnline", "A joins the co-op room and plays on alone"),
                  ("guestOnline", "B joins the same room"),
                  ("joined", "A sees B join"),
                  ("droppedIn", "B drops in to the mission under way"),
                  ("played", "Both play on with no errors or disconnects"),
              ]),
              "handover": ("Host goes to the background", [
                  ("hostOnline", "A joins the co-op room"),
                  ("guestOnline", "B joins the same room"),
                  ("joined", "A sees B join"),
                  ("played", "Both play with no errors or disconnects"),
                  ("asked", "With A's page frozen, B asks for the shared world"),
                  ("tookOver", "B runs the shared world"),
                  ("quick", "Within 10 s of A freezing, before Photon would time A out"),
                  ("playedOn", "B plays on with no errors or disconnects"),
              ]),
              "watch": ("Watching a full room", [
                  ("hostOnline", "A joins the co-op room"),
                  ("guestOnline", "B joins the same room"),
                  ("joined", "A sees B join"),
                  ("watcherIn", "C joins with both seats taken and watches"),
                  ("watching", "C follows the game with no soldier of its own"),
                  ("counted", "A's room counts C watching"),
                  ("played", "Nobody has errors or disconnects"),
              ]),
          }
          title, checks = runs[os.environ["MODE"]]
          try:
              r = json.load(open("coop-test/result.json"))
          except Exception:
              print(f"### {title}\n\nNo result: the test stopped before writing one.\n")
              raise SystemExit
          print(f"### {title}: " + ("passed" if r["ok"] else "failed"))
          print()
          print("| Check | Result |")
          print("|---|---|")
          for key, label in checks:
              print(f"| {label} | {'✅' if r['checks'].get(key) else '❌'} |")
          if r.get("failure"):
              print()
              print("Stopped: " + r["failure"])
          print()
          if "pickups" in r and r.get("mode") != "boss":
              print(f"Pickups given out while playing: {r['pickups']}.")
              print()
          print(f"Took {r['seconds']} s. Screenshots and console logs are in this job's artifact.")
          EOF

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coop-test-${{ matrix.mode }}
          path: coop-test
          if-no-files-found: ignore
          retention-days: 7 # GitHub's default is 90; a run's files are only read for a few days

  # The main line goes live only once every co-op test has passed (the drop-in spike's may fail), from the build
  # the tests played.
  deploy-live:
    name: Deploy the live game
    needs: [plan, build-and-deploy, coop-test]
    if: needs.plan.outputs.slug == '' && needs.build-and-deploy.result == 'success' && needs.coop-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: tools

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: PooketSlug-WebGL
          path: site

      - name: Deploy to gh-pages
        run: |
          tools/pages_deploy.sh main site
          echo "### Live: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
