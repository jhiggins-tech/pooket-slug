name: WebGL build → GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore: # docs never change the game, and a redeploy changes the build version co-op players must share
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write # peaceiris/actions-gh-pages pushes the build to the gh-pages branch

# A run under way finishes (and deploys) before the next starts; of the pushes that land meanwhile, only the newest
# waits its turn. Cancelling the run under way instead (as it did until 2026-10-16) meant that with several threads
# pushing to the same branch, nothing ever got as far as deploying.
concurrency:
  group: webgl-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build WebGL with GameCI and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The unityci/editor WebGL image is ~7 GB compressed; make room for it on the hosted runner.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v5

      # Photon's license forbids redistributing the SDK, so it is stored as a release asset in a private
      # repo and unpacked into Assets/Photon here, before Unity starts (see tools/unpack_unitypackage.py).
      - name: Fetch Photon Fusion SDK
        env:
          GH_TOKEN: ${{ secrets.VENDOR_PAT }}
          FUSION_TAG: fusion-2.1.3
          FUSION_FILE: Photon-Fusion-2.1.3-Stable-2390.unitypackage
          FUSION_SHA256: 375e21bc771ce5f7cea942b5f804e7c28c8f4d858f7e9aab96725214564bc52e
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret VENDOR_PAT is not set (read-only token for jhiggins-tech/pooket-slug-vendor)."
            exit 1
          fi
          gh release download "$FUSION_TAG" -R jhiggins-tech/pooket-slug-vendor -p "$FUSION_FILE" -D vendor
          echo "$FUSION_SHA256  vendor/$FUSION_FILE" | sha256sum -c -
          python3 -I tools/unpack_unitypackage.py "vendor/$FUSION_FILE" .
          # our committed Fusion config wins over anything the package ships
          git checkout -- Assets/Photon/Fusion/Resources/NetworkProjectConfig.fusion

      # The arcade announcer's lines are made with text-to-speech by the vendor repository's CI (voice/lines.json
      # there) and published as announcer.zip. Without them the game still builds, and the announcer stays quiet.
      - name: Fetch the announcer's voice
        env:
          GH_TOKEN: ${{ secrets.VENDOR_PAT }}
        run: |
          if gh release download announcer -R jhiggins-tech/pooket-slug-vendor -p announcer.zip -D vendor; then
            mkdir -p Assets/Resources/Voice
            unzip -o -q vendor/announcer.zip '*.wav' -d Assets/Resources/Voice
            # .bytes, so Unity keeps them as raw WAV bytes (Sfx.Say makes the clips) instead of encoding them as AAC
            for f in Assets/Resources/Voice/*.wav; do mv "$f" "${f%.wav}.bytes"; done
            ls -l Assets/Resources/Voice
          else
            echo "::warning::No announcer.zip on the vendor repository's announcer release: the announcer stays quiet in this build."
          fi

      # The cutscene narrator's lines, in the narrator's voice (voice F from the narrator voice spike), made by the vendor
      # repository's Narration workflow (voice/narration.json there) and published as narration.zip: <line>.wav for each
      # line. Without them the narrator is subtitles only.
      - name: Fetch the narrator's lines
        env:
          GH_TOKEN: ${{ secrets.VENDOR_PAT }}
        run: |
          if gh release download narration -R jhiggins-tech/pooket-slug-vendor -p narration.zip -D vendor; then
            mkdir -p Assets/Resources/Narration
            unzip -o -q vendor/narration.zip '*.wav' -x sample.wav -d Assets/Resources/Narration
            for f in Assets/Resources/Narration/*.wav; do mv "$f" "${f%.wav}.bytes"; done
            ls -l Assets/Resources/Narration
          else
            echo "::warning::No narration.zip on the vendor repository's narration release: the narrator is subtitles only."
          fi

      # The boss music's final section played by an orchestra (?spike=music crossfades to it), rendered from the
      # game's own notes by the vendor repository's CI (music/ there) and published as orchestra.zip. Without it the
      # final section stays chip all the way.
      - name: Fetch the orchestral music
        env:
          GH_TOKEN: ${{ secrets.VENDOR_PAT }}
        run: |
          if gh release download orchestra -R jhiggins-tech/pooket-slug-vendor -p orchestra.zip -D vendor; then
            mkdir -p Assets/Resources/Music
            unzip -o -q vendor/orchestra.zip '*.wav' -d Assets/Resources/Music
            for f in Assets/Resources/Music/*.wav; do mv "$f" "${f%.wav}.bytes"; done
            ls -l Assets/Resources/Music
          else
            echo "::warning::No orchestra.zip on the vendor repository's orchestra release: the boss music stays chip."
          fi

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      # The tests run in the same editor image as the build, so it's only pulled once.
      - name: Pick the editor image
        id: editor
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          echo "image=unityci/editor:ubuntu-$version-webgl-3" >> "$GITHUB_OUTPUT"

      # EditMode tests for the pure game logic (Assets/Scripts/Core, tests in Assets/Tests/EditMode).
      # A failing test stops the job here, so a broken build never deploys. Pinned to v4.3.2, the last
      # release that runs Unity itself: v4.4.0 (the v4 tag) wraps game-ci/cli, which rejected the flag the
      # action passed for coverageEnabled: false. No githubToken, so no check run: the summary lists results.
      - name: Run EditMode tests (GameCI)
        id: tests
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: ${{ steps.editor.outputs.image }}
          testMode: editmode
          artifactsPath: test-results

      - name: Test summary
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob('test-results/*.xml'))
          if not files:
              print("### EditMode tests\n\nNo results: Unity stopped before writing them. The test step's log says why.")
              raise SystemExit
          run = ET.parse(files[0]).getroot()
          print("### EditMode tests: " + ("passed" if run.get("result", "").startswith("Passed") else "failed"))
          print()
          print(f"{run.get('passed')} of {run.get('total')} passed, {run.get('failed')} failed, "
                f"{run.get('skipped')} skipped, in {float(run.get('duration') or 0):.1f} s.")
          failed = [t for t in run.iter('test-case') if t.get('result') == 'Failed']
          if failed:
              print()
          for t in failed[:30]:
              message = (t.findtext('failure/message') or '').strip().splitlines()
              print(f"- `{t.get('fullname')}`: {message[0] if message else 'failed'}")
          EOF

      - name: Upload test results
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: editmode-tests
          path: test-results
          if-no-files-found: ignore

      - name: Build WebGL (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: PooketSlug.EditorTools.WebGLBuild.Build
          customParameters: -buildSha ${{ github.sha }} -photonAppId ${{ secrets.PHOTON_APP_ID }} -googleClientId ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }} -firebaseApiKey ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }} -firebaseDbUrl ${{ vars.FIREBASE_DB_URL || secrets.FIREBASE_DB_URL }}
          versioning: None

      # The ⓘ kit screen's demo clips: the build just made plays each move's scripted scene (?demo=all, KitGuide.cs) in
      # headless Chromium, which records it, and tools/demos.mjs cuts it into a clip for each move in demos/, so the
      # clips always match the build they ship with. If recording fails, the build still deploys, and the kit screen
      # says there's no demo yet.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Record the kit screen's demos
        id: demos
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 --bind 127.0.0.1 --directory build/WebGL/WebGL > demo-server.log 2>&1 &
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/index.html && break; sleep 1; done
          node tools/demos.mjs http://127.0.0.1:8000/index.html demos
          sudo mkdir -p build/WebGL/WebGL/demos
          sudo cp demos/*.mp4 build/WebGL/WebGL/demos/
          ls -l build/WebGL/WebGL/demos

      - name: Demos summary
        if: always() && steps.demos.outcome != 'skipped'
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          try:
              demos = json.load(open('demos/demos.json'))
          except Exception:
              print("### Kit demos: not recorded\n\nThe recording step's log says why; the kit screen says there's no demo yet.")
              raise SystemExit
          print(f"### Kit demos: {len(demos)} recorded\n")
          print("| Move | Game seconds | Recorded in | Size |")
          print("|---|---|---|---|")
          for d in demos:
              print(f"| `{d['id']}` | {d['gameSeconds']} s | {d['recordedSeconds']} s | {d['bytes'] // 1024} KB |")
          EOF

      - name: Upload the demos
        if: always() && steps.demos.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: kit-demos
          path: demos
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: PooketSlug-WebGL
          path: build/WebGL/WebGL
          if-no-files-found: error

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/WebGL/WebGL
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Deploy ${{ github.sha }} from ${{ github.ref_name }}

      - name: Summary
        run: |
          {
            echo "### Pooket Slug WebGL build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo "- Unity: \`$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)\`"
            echo "- Build size: $(du -sh build/WebGL/WebGL | cut -f1)"
            echo "- Live: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } >> "$GITHUB_STEP_SUMMARY"

  # Two players in two headless browsers, against the build just made: A hosts, B joins by invite link,
  # both play, then A leaves and B must take over the shared world. GitHub's runners can open the
  # WebSockets Photon needs (the cloud sandbox can't), so this is where co-op gets tested on every push.
  coop-test:
    name: Two-player co-op test
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: PooketSlug-WebGL
          path: site

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Serve the build
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory site > server.log 2>&1 &
          for i in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/index.html && exit 0
            sleep 1
          done
          echo "::error::The build didn't start serving on port 8000."
          exit 1

      - name: Host, join, play, and hand over the world
        run: node tools/coop.mjs http://127.0.0.1:8000/index.html coop-test code

      - name: Fight the boss together
        if: success() || failure()
        run: node tools/coop.mjs http://127.0.0.1:8000/index.html coop-test/boss boss

      - name: Watch a scene together (a stand-in, as Mission one is solo only)
        if: success() || failure()
        run: node tools/coop.mjs http://127.0.0.1:8000/index.html coop-test/scene scene

      - name: Summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          runs = [
              ("Two-player co-op test", "coop-test/result.json", [
                  ("hostOnline", "A hosts a room"),
                  ("guestOnline", "B joins with the invite link"),
                  ("joined", "A sees B join"),
                  ("played", "Both play with no errors or disconnects"),
                  ("pickup", "A's world hands out the test crate (?test=crate)"),
                  ("takeover", "B takes over the world when A leaves"),
              ]),
              ("Two-player boss fight", "coop-test/boss/result.json", [
                  ("hostOnline", "A hosts a room"),
                  ("guestOnline", "B joins with the invite link"),
                  ("joined", "A sees B join"),
                  ("played", "Both fight the boss with no errors or disconnects"),
                  ("bossIntro", "Both screens get the boss intro"),
                  ("bossFought", "A's tank rolls out and fires"),
                  ("bossFollowed", "B's boss tank follows the turret of A's"),
                  ("bossFired", "B sees the boss tank fire in A's world"),
              ]),
              ("Two-player scene (?test=scene)", "coop-test/scene/result.json", [
                  ("hostOnline", "A hosts a room"),
                  ("guestOnline", "B joins with the invite link"),
                  ("joined", "A sees B join"),
                  ("bothInScene", "Starting together, a scene plays on both phones"),
                  ("waited", "A tapping alone moves neither phone on"),
                  ("tappedThrough", "Both tapping moves each shot on"),
                  ("together", "It ends on both phones together"),
                  ("played", "Both play on with no errors or disconnects"),
              ]),
          ]
          for title, path, checks in runs:
              try:
                  r = json.load(open(path))
              except Exception:
                  print(f"### {title}\n\nNo result: the test stopped before writing one.\n")
                  continue
              print(f"### {title}: " + ("passed" if r["ok"] else "failed"))
              print()
              print("| Check | Result |")
              print("|---|---|")
              for key, label in checks:
                  print(f"| {label} | {'✅' if r['checks'].get(key) else '❌'} |")
              if r.get("failure"):
                  print()
                  print("Stopped: " + r["failure"])
              print()
              if "pickups" in r and r.get("mode") != "boss":
                  print(f"Pickups given out while playing: {r['pickups']}.")
                  print()
              print(f"Took {r['seconds']} s. Screenshots and console logs are in the coop-test artifact.")
              print()
          EOF

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coop-test
          path: coop-test
          if-no-files-found: ignore
