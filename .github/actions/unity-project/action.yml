# Gets a checkout ready for Unity, the same for the tests and the build (webgl-pages.yml): room for the editor image,
# the Photon SDK (and a check that none of it is committed), the vendor sounds, the built-in scenes, the Library cache
# and the editor image's name. Runs after actions/checkout.
name: Unity project
description: Prepare the checkout for a GameCI Unity step
inputs:
  vendor-token:
    description: Read token for the private vendor repository (secrets.VENDOR_PAT)
    required: true
  strict:
    description: "'true' on the main line: a vendor sound that can't be fetched fails the build"
    default: 'false'
  save-library:
    description: "'true' to save the Library cache after the job (the build); else it's only restored (the tests)"
    default: 'false'
outputs:
  image:
    description: The unityci/editor image for this Unity version
    value: ${{ steps.editor.outputs.image }}
runs:
  using: composite
  steps:
    # The unityci/editor WebGL image is ~7 GB compressed. Rather than spend 2 minutes deleting preinstalled tools to
    # make room for it, Docker keeps its images on the runner's second disk (/mnt), which is mostly empty
    # (spike-ci-disk: 8 s instead of 126).
    - name: Move Docker's storage to the second disk
      shell: bash
      run: |
        sudo systemctl stop docker docker.socket
        sudo mkdir -p /mnt/docker
        echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
        sudo systemctl start docker
        docker info --format 'Docker storage: {{.DockerRootDir}}'
        df -h / /mnt

    # Photon's license forbids redistributing the SDK, so the public repository holds only our Fusion config: anything
    # else of Photon's committed fails here, before it's built.
    - name: Check no Photon SDK is committed
      shell: bash
      run: |
        found=$(git ls-files 'Assets/Photon/**' '*.unitypackage' '*Fusion.Runtime.dll' '*Fusion.Common.dll' '*Fusion.Sockets.dll' |
          grep -vx 'Assets/Photon/Fusion/Resources/NetworkProjectConfig.fusion' || true)
        if [ -n "$found" ]; then
          echo "::error::Photon's SDK is licensed and must not be in this public repository. Remove these: $(echo $found)"
          exit 1
        fi

    # The SDK is a release asset in the private vendor repository, unpacked into Assets/Photon before Unity starts
    # (see tools/unpack_unitypackage.py).
    - name: Fetch Photon Fusion SDK
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.vendor-token }}
        FUSION_TAG: fusion-2.1.3
        FUSION_FILE: Photon-Fusion-2.1.3-Stable-2390.unitypackage
        FUSION_SHA256: 375e21bc771ce5f7cea942b5f804e7c28c8f4d858f7e9aab96725214564bc52e
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::Repository secret VENDOR_PAT is not set (read-only token for jhiggins-tech/pooket-slug-vendor)."
          exit 1
        fi
        gh release download "$FUSION_TAG" -R jhiggins-tech/pooket-slug-vendor -p "$FUSION_FILE" -D vendor
        echo "$FUSION_SHA256  vendor/$FUSION_FILE" | sha256sum -c -
        python3 -I tools/unpack_unitypackage.py "vendor/$FUSION_FILE" .
        # our committed Fusion config wins over anything the package ships
        git checkout -- Assets/Photon/Fusion/Resources/NetworkProjectConfig.fusion

    # Sounds the vendor repository's CI makes, exactly as vendor.lock pins them (tools/vendor_fetch.sh): the arcade
    # announcer (voice/lines.json there), the cutscene narrator (voice/narration.json, <line>.wav for each line), the
    # boss music's orchestral section, and the title and den themes (one seamless-loop WAV each). On the main line a
    # missing one fails the build, so the live game never ships silent; a preview builds without it, a little quieter.
    - name: Fetch the announcer, narrator, orchestra, title theme and den theme
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.vendor-token }}
        VENDOR_STRICT: ${{ inputs.strict }}
      run: |
        tools/vendor_fetch.sh --bytes announcer Assets/Resources/Voice "the announcer stays quiet in this build"
        tools/vendor_fetch.sh --bytes narration Assets/Resources/Narration "the narrator is subtitles only"
        tools/vendor_fetch.sh --bytes orchestra Assets/Resources/Music "the boss music stays chip"
        tools/vendor_fetch.sh --bytes start-music Assets/Resources/Music "the splash screen is silent"
        tools/vendor_fetch.sh --bytes den-music Assets/Resources/Music "the den is silent"

    # The cutscenes built into the game (scenes/*.txt as Resources/Scenes), the copy that plays when the site's can't
    # be reached or has a problem.
    - name: Build in the scenes
      shell: bash
      run: |
        mkdir -p Assets/Resources/Scenes
        cp scenes/*.txt Assets/Resources/Scenes/
        ls -l Assets/Resources/Scenes

    # One Library cache, saved by the build; the tests start from it too but don't save their own, so the two jobs
    # don't race to save it or double what the repository's cache holds.
    - name: Cache Unity Library
      if: inputs.save-library == 'true'
      uses: actions/cache@v5
      with:
        path: Library
        key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
        restore-keys: |
          Library-WebGL-

    - name: Restore Unity Library
      if: inputs.save-library != 'true'
      uses: actions/cache/restore@v5
      with:
        path: Library
        key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
        restore-keys: |
          Library-WebGL-

    - name: Pick the editor image
      id: editor
      shell: bash
      run: |
        version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
        echo "image=unityci/editor:ubuntu-$version-webgl-3" >> "$GITHUB_OUTPUT"
