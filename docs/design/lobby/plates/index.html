<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pooket Slug: the room plates (work in progress)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #12100e; color: #e8e0d4;
         font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lede { color: #a89c8c; margin: 0 0 24px; max-width: 60ch; }
  figure { margin: 0 0 28px; }
  figcaption { color: #a89c8c; font-size: 12px; }
  figcaption b { color: #f0c14b; font-size: 14px; display: block; }
  figcaption span { display: block; }
  .pics { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-top: 8px; }
  .pics img { display: block; image-rendering: pixelated; border: 1px solid #3a332c; }
  .small img { width: 320px; height: auto; }
</style>
</head>
<body>
<h1>The room plates (work in progress)</h1>
<p class="lede">Painted with OpenRouter's Qwen Image 2.1 Turbo, with the game's own
den and loft paintings as image references so the style stays in. Not in the game yet.</p>
  <figure>
    <figcaption><b>The kitchen</b><span>out the den's side door</span></figcaption>
    <div class="pics">
      <figure class="big"><img src="wip-kitchen.png" width="1280" height="720" alt="The kitchen"><figcaption>1280 &times; 720</figcaption></figure>
      <figure class="small"><img src="game-kitchen.png" width="320" height="180" alt="The kitchen at game size"><figcaption>at game size, 320 &times; 180</figcaption></figure>
    </div>
  </figure>
  <figure>
    <figcaption><b>The back yard</b><span>out the kitchen's back door</span></figcaption>
    <div class="pics">
      <figure class="big"><img src="wip-yard.png" width="1280" height="720" alt="The back yard"><figcaption>1280 &times; 720</figcaption></figure>
      <figure class="small"><img src="game-yard.png" width="320" height="180" alt="The back yard at game size"><figcaption>at game size, 320 &times; 180</figcaption></figure>
    </div>
  </figure>
  <figure>
    <figcaption><b>B1, the basement</b><span>down the trapdoor in front of the couch</span></figcaption>
    <div class="pics">
      <figure class="big"><img src="wip-basement.png" width="1280" height="720" alt="B1, the basement"><figcaption>1280 &times; 720</figcaption></figure>
      <figure class="small"><img src="game-basement.png" width="320" height="180" alt="B1, the basement at game size"><figcaption>at game size, 320 &times; 180</figcaption></figure>
    </div>
  </figure>
  <figure>
    <figcaption><b>The rooftop</b><span>out the loft's far-left door</span></figcaption>
    <div class="pics">
      <figure class="big"><img src="wip-rooftop.png" width="1280" height="720" alt="The rooftop"><figcaption>1280 &times; 720</figcaption></figure>
      <figure class="small"><img src="game-rooftop.png" width="320" height="180" alt="The rooftop at game size"><figcaption>at game size, 320 &times; 180</figcaption></figure>
    </div>
  </figure>
  <figure>
    <figcaption><b>The shower block</b><span>out the loft's shower door</span></figcaption>
    <div class="pics">
      <figure class="big"><img src="wip-shower.png" width="1280" height="720" alt="The shower block"><figcaption>1280 &times; 720</figcaption></figure>
      <figure class="small"><img src="game-shower.png" width="320" height="180" alt="The shower block at game size"><figcaption>at game size, 320 &times; 180</figcaption></figure>
    </div>
  </figure>
  <figure>
    <figcaption><b>The wintergarden</b><span>out the loft's wintergarden door</span></figcaption>
    <div class="pics">
      <figure class="big"><img src="wip-winter.png" width="1024" height="1024" alt="The wintergarden"><figcaption>1024 &times; 1024</figcaption></figure>
      <figure class="small"><img src="game-winter.png" width="320" height="320" alt="The wintergarden at game size"><figcaption>at game size, 320 &times; 320</figcaption></figure>
    </div>
  </figure>
</body>
</html>
